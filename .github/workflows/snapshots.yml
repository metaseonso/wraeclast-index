# Freezes the index under the patch it is from (tools/snapshot.py) whenever a push changes the cards, and keeps
# it as the release snapshot-<build> on the private data repo, metaseonso/wraeclast-data. Each patch the index
# is not frozen under is gone: the export only ever holds the live one.
# A snapshot is a handful of compressed files (about 460 KB at 0.5.5). An upload that would change nothing sends
# nothing, and once the index moves to a new build the old release is never touched again.
# The data repo is another repo, so GitHub's own token cannot write to it: this needs the secret DATA_REPO_TOKEN,
# a fine-grained token for metaseonso/wraeclast-data only, with Contents: read and write (releases are contents).
name: Patch snapshot

on:
  push:
    branches: [main]
    paths:
      - 'data/index.json'
      - 'data/explore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The token for the data repo is there
        env:
          T: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::DATA_REPO_TOKEN is not set: no snapshot can be kept. See README.md, Patches, snapshots and price history."
            exit 1
          fi
      - name: The index's build is in the patch registry
        run: python tools/patches.py --check
      - name: Freeze the index and keep it on the data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python tools/snapshot.py --upload
